name: Publish COVER demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run typecheck
      - name: Build the German demo
        run: npm run build
        env:
          COVER_STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: /cover-website-demo
          NEXT_PUBLIC_SITE_URL: https://jerichocarloat.github.io/cover-website-demo
      - name: Verify routes, links and assets
        run: node qa/check-german-demo.mjs
        env:
          NEXT_PUBLIC_BASE_PATH: /cover-website-demo
          NEXT_PUBLIC_SITE_URL: https://jerichocarloat.github.io/cover-website-demo
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish demo
        id: deployment
        uses: actions/deploy-pages@v4
